name: 최근 블로그 글 갱신

on:
  schedule:
    - cron: '17 22 * * *'   # 매일 07:17 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://rss.blog.naver.com/qhtjd1216.xml"
          max_post_count: 1
          commit_message: "최근 블로그 글 갱신"
